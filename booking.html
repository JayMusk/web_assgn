<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking - Turner & Torque Auto Repair</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<!-- HEADER and Navigation-->
<header class="header">
    <div class="logo">
        <img src="images/logo.png" alt="Logo " width="100px" height="100px">
    </div>

    <h1>Turner & Torque Auto Repair</h1>

    <nav>
        <a href="index.html" class="btn dark">Home Page</a>
        <a href="services.html" class="btn light">Services</a>
    </nav>
</header>

<!-- BOOKING PAGE -->
<section id="booking" class="booking">

    <div class="section-header">
        <h2>BOOK YOUR APPOINTMENT</h2>
    </div>

    <div class="booking-content">

        <!-- VEHICLE INFO -->
        <div class="vehicle-info">
            <h3>Vehicle Info:</h3>

            <label>Name:</label>
            <input type="text">

            <label>Model Number:</label>
            <input type="text">

            <textarea placeholder="Visible parts destroyed..."></textarea>

            <div class="vehicle-img">
                <img src="images/damaged.png" alt="Vehicle preview">
            </div>
        </div>

        <!-- DATE PICKER -->
        <div class="date-picker">
            <h3>Date Picker</h3>
            <input type="text" placeholder="Month">
            <input type="text" placeholder="Day">
            <input type="text" placeholder="Hour">
            <h4>Date Display</h4>
            <input type="text">
        </div>
        <div class="calculator">
            <h3>Cost Calculator</h3>
            <input type="text" placeholder="Service cost">
            <input type="text" placeholder="Parts cost">
            <h4>Total Cost</h4>
            <input type="text">
            <button class="red light">Book Now</button>
        </div>
    </div>

</section>
<footer class="footer">
        <p>&copy; 2024 Turner & Torque Auto Repair. All rights reserved.</p>
    </footer>
</body>
</html>
